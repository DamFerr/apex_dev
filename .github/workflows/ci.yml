name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm test            # unit tests: stats-core, draft-engine, lcu-core, api
      - run: pnpm build           # type-check + production build
      - run: pnpm --filter desktop exec playwright install --with-deps chromium
      - run: pnpm --filter desktop test:e2e
