name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to 26.04, whose apt mirrors timed out during the Playwright install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm test            # unit tests: stats-core, draft-engine, lcu-core, api
      - run: pnpm build           # type-check + production build
      - name: "Install Playwright browser (retried, apt mirrors sometimes time out)"
        run: |
          for i in 1 2 3; do
            pnpm --filter desktop exec playwright install --with-deps chromium && exit 0
            echo "attempt $i failed, retrying in 20 s"; sleep 20
          done
          exit 1
      - run: pnpm --filter desktop test:e2e
